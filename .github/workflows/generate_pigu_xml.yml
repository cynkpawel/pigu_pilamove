name: Automatyczny Generator Pigu XML

on:
  workflow_dispatch: # Wyłącznie ręczne uruchamianie przyciskiem

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Transformacja XML
        run: python transform_xml.py

      - name: Zapis i publikacja pliku pigu.xml na GitHubie
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add pigu.xml
          git commit -m "Jednorazowa generacja pigu.xml [skip ci]" || exit 0
          git push
